name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer version without the v prefix
        required: true
        default: 0.1.0
      publish_winget:
        description: Submit generated manifests to microsoft/winget-pkgs
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: audio-enforcer-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, release, and publish
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.merged == true &&
          (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
           contains(github.event.pull_request.labels.*.name, 'release:minor') ||
           contains(github.event.pull_request.labels.*.name, 'release:major')))
      }}
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:REQUESTED_VERSION.TrimStart('v')
          } else {
            $levels = @('major', 'minor', 'patch') | Where-Object {
              ($env:PR_LABELS -split ',') -contains "release:$_"
            }
            if ($levels.Count -ne 1) {
              throw 'A release PR must have exactly one release label.'
            }
            $latestTag = git tag --list 'v[0-9]*' --sort=-version:refname | Select-Object -First 1
            if (-not $latestTag) {
              throw 'No prior release tag exists. Run the workflow manually for the initial release.'
            }
            $current = [version]$latestTag.TrimStart('v')
            switch ($levels[0]) {
              'major' { $version = "$(($current.Major + 1)).0.0" }
              'minor' { $version = "$($current.Major).$(($current.Minor + 1)).0" }
              'patch' { $version = "$($current.Major).$($current.Minor).$(($current.Build + 1))" }
            }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' must be SemVer major.minor.patch."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Create or update GitHub release
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          $msi = Get-ChildItem artifacts/installer/*.msi | Select-Object -First 1
          gh release view $env:TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $msi.FullName --clobber --repo '${{ github.repository }}'
          } else {
            gh release create $env:TAG $msi.FullName --repo '${{ github.repository }}' --target $env:TARGET_SHA --title "Audio Enforcer $env:VERSION" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
      - name: Generate production WinGet manifests
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $msi = Get-ChildItem artifacts/installer/*.msi | Select-Object -First 1
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($msi.Name)"
          ./scripts/New-WinGetManifest.ps1 -Version $version -InstallerPath $msi.FullName -InstallerUrl $url -OutputDirectory "artifacts/winget/$version"
      - name: Wait for public installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $msi = Get-ChildItem artifacts/installer/*.msi | Select-Object -First 1
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$($msi.Name)"
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing | Out-Null
              exit 0
            } catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 10
            }
          }
      - name: Validate WinGet manifests when available
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest "artifacts/winget/${{ steps.version.outputs.version }}" --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "winget validate failed with exit code $LASTEXITCODE." }
          } else {
            Write-Warning 'winget is unavailable on this hosted runner; WingetCreate validates during submission.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AudioEnforcer-${{ steps.version.outputs.version }}
          path: |
            artifacts/installer/*.msi
            artifacts/winget/${{ steps.version.outputs.version }}/*.yaml
      - name: Submit WinGet pull request
        if: github.event_name == 'pull_request' || inputs.publish_winget
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw 'Configure the WINGET_CREATE_GITHUB_TOKEN Actions secret before publishing to WinGet.'
          }
          Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --no-open --prtitle "Audio Enforcer ${{ steps.version.outputs.version }}" --token "$env:WINGET_CREATE_GITHUB_TOKEN" "artifacts/winget/${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "WingetCreate failed with exit code $LASTEXITCODE." }
